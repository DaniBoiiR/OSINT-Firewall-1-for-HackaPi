{% extends "base.html" %}
{% block title %}Index of {{ path }} · {{ SITE_NAME }}{% endblock %}
{% block content %}
  <div class="panel">
    <div class="panel-h">Index of {{ path }}</div>
    <div class="callout dirlist">
      <ul>
        {% for f in files %}
          <li><span class="fileicon">📄</span><a href="{{ url_for('resources_file', filename=f) }}">{{ f }}</a></li>
        {% endfor %}
      </ul>
    </div>
  </div>
{% endblock %}
