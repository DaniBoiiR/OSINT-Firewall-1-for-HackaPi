<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a class="auth-brand" href="{{ url_for('feed') }}">
      <span class="mark">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 3 4 20h3.4l1.4-3.2h6.4L16.6 20H20L12 3Zm-2 11 2-4.6 2 4.6h-4Z" fill="#fff"/>
        </svg>
      </span>
      <span class="auth-brand-text">{{ SITE_NAME }}<span class="sub">{{ COMPANY }}</span></span>
    </a>

    <div class="auth-card">
      {% block content %}{% endblock %}
    </div>

    <p class="auth-foot">{% block foot %}{% endblock %}</p>
  </main>
</body>
</html>
